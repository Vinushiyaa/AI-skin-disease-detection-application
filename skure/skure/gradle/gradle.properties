# SSL Certificate Bypass for Gradle Wrapper
systemProp.javax.net.ssl.trustStore=NONE
systemProp.javax.net.ssl.trustStoreType=NONE
systemProp.javax.net.ssl.trustStorePassword=
systemProp.javax.net.ssl.keyStore=NONE
systemProp.javax.net.ssl.keyStoreType=NONE
systemProp.javax.net.ssl.keyStorePassword=
systemProp.javax.net.ssl.trustAll=true
systemProp.javax.net.ssl.trustAllHosts=true
systemProp.com.sun.net.ssl.checkRevocation=false

# Additional SSL bypass for Android repositories
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.javax.net.ssl.trustStoreProvider=SUN
systemProp.javax.net.ssl.trustStoreType=JKS
systemProp.javax.net.ssl.trustStore=
systemProp.javax.net.ssl.trustStorePassword=
systemProp.javax.net.ssl.keyStore=
systemProp.javax.net.ssl.keyStorePassword=
systemProp.javax.net.ssl.keyStoreType=JKS
systemProp.javax.net.ssl.keyStoreProvider=SUN

# Android-specific SSL bypass
systemProp.android.ssl.bypass=true
systemProp.android.ssl.trustAll=true
systemProp.android.ssl.verifyHostname=false
systemProp.android.ssl.verifyPeer=false

# AAPT2 specific SSL bypass
systemProp.aapt2.ssl.bypass=true
systemProp.aapt2.ssl.trustAll=true
