# App-level SSL Certificate Bypass
systemProp.javax.net.ssl.trustStore=NONE
systemProp.javax.net.ssl.trustStoreType=NONE
systemProp.javax.net.ssl.trustStorePassword=
systemProp.javax.net.ssl.keyStore=NONE
systemProp.javax.net.ssl.keyStoreType=NONE
systemProp.javax.net.ssl.keyStorePassword=
systemProp.javax.net.ssl.trustAll=true
systemProp.javax.net.ssl.trustAllHosts=true
systemProp.com.sun.net.ssl.checkRevocation=false

# Android build tools SSL bypass
systemProp.android.build.tools.ssl.bypass=true
systemProp.android.build.tools.ssl.trustAll=true
systemProp.android.build.tools.ssl.verifyHostname=false
systemProp.android.build.tools.ssl.verifyPeer=false

# AAPT2 specific SSL bypass
systemProp.aapt2.ssl.bypass=true
systemProp.aapt2.ssl.trustAll=true

